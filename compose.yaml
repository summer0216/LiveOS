services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liveos
      POSTGRES_USER: liveos
      POSTGRES_PASSWORD: liveos_dev
    ports:
      - "5432:5432"
    volumes:
      - liveos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveos -d liveos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liveos-postgres:
