databases:
  - name: liveos-postgres
    databaseName: liveos
    user: liveos
    plan: free

services:
  - type: web
    name: liveos-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --frozen --python 3.13
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liveos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
