name: liveos-migration-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liveos_migration_test
      POSTGRES_USER: liveos_migration
      POSTGRES_PASSWORD: local_migration_test_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - migration-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U liveos_migration -d liveos_migration_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  migration-test-postgres-data:
